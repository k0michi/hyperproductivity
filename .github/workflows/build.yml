name: Build desktop app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: universal
            artifact: mac-universal
          - os: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
          - os: windows-11-arm
            platform: win
            arch: arm64
            artifact: windows-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: linux-arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Package
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: hyperproductivity-${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
